<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fintech Marketing</title>

    <!-- CSS File -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>AI Fintech Marketing Prediction</h1>

        <form id="predictionForm">

            <input type="number" id="age"
                   placeholder="Enter Age" required>

            <input type="number" id="income"
                   placeholder="Enter Income" required>

            <input type="number" id="creditScore"
                   placeholder="Enter Credit Score" required>

            <input type="number" id="transactions"
                   placeholder="Enter Transactions" required>

            <button type="submit">Predict</button>

        </form>

        <h2 id="result"></h2>

    </div>

    <script>

        document.getElementById("predictionForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const data = {
                Age: document.getElementById("age").value,
                Income: document.getElementById("income").value,
                CreditScore: document.getElementById("creditScore").value,
                Transactions: document.getElementById("transactions").value
            };

            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            document.getElementById("result").innerHTML =
                "Prediction: " + result.Prediction;
        });

    </script>

</body>
</html>
